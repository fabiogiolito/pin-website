<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Donut chart showing developer work arrangements on Stack Overflow in 2024: 42 percent hybrid, 38 percent fully remote, 20 percent in-person">
  <rect width="960" height="360" fill="#E8E0D8" rx="16"/>

  <!-- Title -->
  <text x="50" y="42" fill="#3B3B3B" font-size="22" font-weight="800" font-family="system-ui,sans-serif">Developer Work Arrangements on Stack Overflow (2024)</text>

  <!-- Donut chart centered at (220, 190), outer r=115, inner r=65 -->

  <!-- Hybrid arc: -90deg to 61.2deg (42%) — large arc flag 0 since < 180deg -->
  <!-- outer start: (220, 75)  outer end: (220+115*cos(61.2), 190+115*sin(61.2)) -->
  <!-- cos(61.2deg)=0.4818, sin(61.2deg)=0.8763 -->
  <!-- outer end: (220+55.4, 190+100.8) = (275.4, 290.8) -->
  <!-- inner start: (220, 125)  inner end: (220+65*0.4818, 190+65*0.8763) = (251.3, 247.0) -->
  <path d="M 220 75
             A 115 115 0 0 1 275.4 290.8
             L 251.3 247.0
             A 65 65 0 0 0 220 125
             Z"
        fill="#4CAF50"/>

  <!-- Remote arc: 61.2deg to 198deg (38%) — large arc flag 0 since < 180deg -->
  <!-- outer start: (275.4, 290.8)  end: (220+115*cos(198), 190+115*sin(198)) -->
  <!-- cos(198deg)=-0.9511, sin(198deg)=-0.3090 -->
  <!-- outer end: (220-109.4, 190-35.5) = (110.6, 154.5) -->
  <!-- inner start: (251.3, 247.0)  inner end: (220+65*(-0.9511), 190+65*(-0.3090)) = (158.2, 169.9) -->
  <path d="M 275.4 290.8
             A 115 115 0 0 1 110.6 154.5
             L 158.2 169.9
             A 65 65 0 0 0 251.3 247.0
             Z"
        fill="#6B8F71"/>

  <!-- In-person arc: 198deg to 270deg (20%) — large arc flag 0 since < 180deg -->
  <!-- outer start: (110.6, 154.5)  end: (220, 75) -->
  <!-- inner start: (158.2, 169.9)  inner end: (220, 125) -->
  <path d="M 110.6 154.5
             A 115 115 0 0 1 220 75
             L 220 125
             A 65 65 0 0 0 158.2 169.9
             Z"
        fill="#8B9E8F"/>

  <!-- Center label -->
  <text x="220" y="184" text-anchor="middle" fill="#3B3B3B" font-size="13" font-weight="700" font-family="system-ui,sans-serif">n=65,437</text>
  <text x="220" y="200" text-anchor="middle" fill="#5C5C5C" font-size="11" font-family="system-ui,sans-serif">respondents</text>

  <!-- Percentage labels outside arcs with leader lines -->
  <!-- Hybrid label: midpoint angle = (-90+61.2)/2 = -14.4deg -->
  <!-- label pos outer r=135: (220+135*cos(-14.4), 190+135*sin(-14.4)) = (220+130.8, 190-33.6) = (350.8, 156.4) -->
  <!-- arc midpoint on ring r=90: (220+90*cos(-14.4), 190+90*sin(-14.4)) = (220+87.2, 190-22.4) = (307.2, 167.6) -->
  <line x1="307.2" y1="167.6" x2="342" y2="158" stroke="#4CAF50" stroke-width="1.5" opacity="0.7"/>
  <text x="348" y="155" fill="#3B3B3B" font-size="15" font-weight="800" font-family="system-ui,sans-serif">42%</text>
  <text x="348" y="171" fill="#5C5C5C" font-size="11" font-family="system-ui,sans-serif">Hybrid</text>

  <!-- Remote label: midpoint angle = (61.2+198)/2 = 129.6deg -->
  <!-- arc midpoint r=90: (220+90*cos(129.6), 190+90*sin(129.6)) -->
  <!-- cos(129.6)=-0.6374, sin(129.6)=0.7705 -->
  <!-- = (220-57.4, 190+69.3) = (162.6, 259.3) -->
  <!-- label pos r=140: (220+140*(-0.6374), 190+140*0.7705) = (220-89.2, 190+107.9) = (130.8, 297.9) -->
  <line x1="162.6" y1="259.3" x2="142" y2="288" stroke="#6B8F71" stroke-width="1.5" opacity="0.7"/>
  <text x="98" y="294" fill="#3B3B3B" font-size="15" font-weight="800" font-family="system-ui,sans-serif">38%</text>
  <text x="94" y="310" fill="#5C5C5C" font-size="11" font-family="system-ui,sans-serif">Fully Remote</text>

  <!-- In-person label: midpoint angle = (198+270)/2 = 234deg -->
  <!-- arc midpoint r=90: (220+90*cos(234), 190+90*sin(234)) -->
  <!-- cos(234)=-0.5878, sin(234)=-0.8090 -->
  <!-- = (220-52.9, 190-72.8) = (167.1, 117.2) -->
  <!-- label pos r=140: (220+140*(-0.5878), 190+140*(-0.8090)) = (220-82.3, 190-113.3) = (137.7, 76.7) -->
  <line x1="167.1" y1="117.2" x2="145" y2="90" stroke="#8B9E8F" stroke-width="1.5" opacity="0.7"/>
  <text x="100" y="87" fill="#3B3B3B" font-size="15" font-weight="800" font-family="system-ui,sans-serif">20%</text>
  <text x="90" y="103" fill="#5C5C5C" font-size="11" font-family="system-ui,sans-serif">In-Person</text>

  <!-- Legend — positioned to the right of the donut -->
  <circle cx="480" cy="155" r="8" fill="#4CAF50"/>
  <text x="496" y="160" fill="#5C5C5C" font-size="13" font-family="system-ui,sans-serif">Hybrid — 42%</text>

  <circle cx="480" cy="185" r="8" fill="#6B8F71"/>
  <text x="496" y="190" fill="#5C5C5C" font-size="13" font-family="system-ui,sans-serif">Fully Remote — 38%</text>

  <circle cx="480" cy="215" r="8" fill="#8B9E8F"/>
  <text x="496" y="220" fill="#5C5C5C" font-size="13" font-family="system-ui,sans-serif">In-Person — 20%</text>

  <!-- Insight callout -->
  <rect x="460" y="240" width="450" height="52" rx="8" fill="#fff" fill-opacity="0.45"/>
  <text x="475" y="261" fill="#3B3B3B" font-size="12" font-weight="700" font-family="system-ui,sans-serif">Key insight:</text>
  <text x="475" y="277" fill="#5C5C5C" font-size="12" font-family="system-ui,sans-serif">80% of SO developers expect hybrid or fully remote</text>
  <text x="475" y="291" fill="#5C5C5C" font-size="12" font-family="system-ui,sans-serif">— factor this into your outreach and job specs.</text>

  <!-- Source -->
  <text x="480" y="338" fill="#8B8178" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">Source: Stack Overflow 2024 Developer Survey (n=65,437)</text>
</svg>
